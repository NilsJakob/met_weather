name: Weather Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # ✅ runs every hour (UTC)
  push:
    branches:
      - main

# ✅ REQUIRED to allow pushing back to repo
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ✅ Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv matplotlib folium geopandas shapely

      # ✅ Step 4: Run pipeline
      - name: Run weather pipeline
        env:
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
        run: |
          python weather_pipeline.py

      # ✅ Step 5: Commit and push updated data
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add forecast.csv observations.csv

          git diff --cached --quiet || git commit -m "Update weather data"

          git push origin HEAD:main
